name: Update AU 2026 catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-catalog.mjs"
      - "package.json"
      - ".github/workflows/update-catalog.yml"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: au2026-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install scraper
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download complete AU catalog
        run: npm run update-catalog
      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Update complete AU 2026 course catalog"
          git push
