<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AU 2026 選課管理 · 9/15–17 Las Vegas</title>
<style>
  :root{
    --paper:#F2F3EF; --ink:#15181C; --muted:#666D76; --line:#D8DAD4;
    --cobalt:#1F3FBF; --cobalt-soft:#E4E9FB; --amber:#B97A0A; --amber-soft:#FBEFD8;
    --alert:#B33A1E; --alert-soft:#F9E4DC; --ok:#2E6B3F; --ok-soft:#E1EFE4;
    --card:#FFFFFF; --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:92px;}
  header{background:var(--ink);color:#F5F5F2;padding:18px 16px 14px;}
  header h1{font-size:20px;font-weight:700;letter-spacing:.02em}
  header .sub{font-size:12.5px;color:#B9BDC4;margin-top:2px}
  header .sub b{color:#F0C468;font-weight:600}
  nav.days{display:flex;gap:6px;overflow-x:auto;background:var(--ink);padding:0 12px 12px;position:sticky;top:0;z-index:20;}
  nav.days button{flex:0 0 auto;border:1px solid #3A3F47;background:transparent;color:#C8CCD2;
    padding:7px 13px;border-radius:999px;font-size:13.5px;cursor:pointer;font-family:inherit;}
  nav.days button.on{background:#F5F5F2;color:var(--ink);border-color:#F5F5F2;font-weight:700}
  nav.days button .n{font-size:11px;opacity:.75;margin-left:3px}
  .toolbar{padding:12px 14px 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:760px;margin:0 auto}
  .toolbar input[type=search]{flex:1 1 160px;min-width:140px;padding:8px 12px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;background:var(--card);font-family:inherit;}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:6px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:8px 14px 20px;max-width:760px;margin:0 auto}
  .daytitle{margin:16px 2px 8px;font-size:13px;color:var(--muted);display:flex;align-items:baseline;gap:8px;}
  .daytitle b{font-size:15px;color:var(--ink)}
  .slot{display:grid;grid-template-columns:56px 1fr;gap:0 10px;margin-bottom:10px}
  .slot .time{font-variant-numeric:tabular-nums;text-align:right;padding-top:12px;font-size:13px;color:var(--ink);font-weight:600;line-height:1.35;}
  .slot .time .end{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .slot .time.tbd{color:var(--amber);font-size:12px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;cursor:pointer;border-left:4px solid var(--line);}
  .card.p-star{border-left-color:var(--amber)}
  .card.p-alt{border-left-color:var(--cobalt)}
  .card.done{opacity:.72}
  .card .row1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .card .code{font-size:12.5px;font-weight:700;color:var(--cobalt);letter-spacing:.03em}
  .card h3{font-size:15px;font-weight:600;margin-top:2px}
  .card .meta{margin-top:5px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
  .badge{display:inline-block;font-size:11.5px;padding:1.5px 8px;border-radius:999px;font-weight:600}
  .b-star{background:var(--amber-soft);color:var(--amber)}
  .b-alt{background:var(--cobalt-soft);color:var(--cobalt)}
  .b-lab{background:#EFE4F6;color:#6B3A93}
  .b-reg{background:var(--ok-soft);color:var(--ok)}
  .b-wait{background:var(--alert-soft);color:var(--alert)}
  .b-done{background:#E4E5E2;color:#555}
  .b-replay{background:#E2EFF2;color:#20606B}
  .b-dig{background:#EDEEF0;color:#555}
  .conflict{background:var(--alert-soft);border:1px solid #E2B4A4;color:var(--alert);
    font-size:12.5px;border-radius:8px;padding:6px 10px;margin:2px 0 8px 66px;font-weight:600;}
  .note-preview{margin-top:6px;font-size:12.5px;color:#4C5158;background:#F6F6F2;border-radius:6px;padding:5px 9px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--muted);text-align:center;padding:36px 10px;font-size:14px}
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(242,243,239,.96);
    border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;justify-content:center;}
  .btn{font-family:inherit;font-size:14px;padding:9px 16px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);}
  .btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:700}
  .btn.small{font-size:12.5px;padding:6px 11px}
  .btn.danger{color:var(--alert);border-color:#E2B4A4}
  dialog{border:none;border-radius:14px;max-width:600px;width:calc(100% - 28px);padding:0;margin:auto;max-height:88vh;}
  dialog::backdrop{background:rgba(20,22,26,.5)}
  .dlg-head{padding:15px 18px 0;display:flex;justify-content:space-between;align-items:center}
  .dlg-head h2{font-size:17px}
  .dlg-body{padding:12px 18px 18px;display:grid;gap:10px}
  label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
  label.f input,label.f select,label.f textarea{font-family:inherit;font-size:14.5px;padding:8px 10px;
    border:1px solid var(--line);border-radius:8px;background:#FCFCFA;color:var(--ink);}
  label.f textarea{min-height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .dlg-actions{display:flex;gap:8px;justify-content:space-between;padding-top:4px}
  .dlg-actions .right{display:flex;gap:8px}
  .cat-item{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;gap:10px;align-items:flex-start;background:#FCFCFA}
  .cat-item .info{flex:1;min-width:0}
  .cat-item .c{font-size:12px;font-weight:700;color:var(--cobalt)}
  .cat-item .t{font-size:13.5px;font-weight:600}
  .title-en{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .cat-item .m{font-size:12px;color:var(--muted);margin-top:2px}
  #catList{display:grid;gap:8px;max-height:38vh;overflow-y:auto}
  .hint{font-size:12px;color:var(--muted)}
  .datablock{padding:14px;border-top:1px dashed var(--line);margin-top:20px;max-width:760px;margin-left:auto;margin-right:auto}
  .datablock h4{font-size:13.5px;margin-bottom:6px}
  .datablock p{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .datablock .btns{display:flex;flex-wrap:wrap;gap:8px}
  @media print{header,nav.days,.toolbar,.bottombar,.datablock{display:none}
    body{background:#fff;padding:0}.card{break-inside:avoid;cursor:default}}
</style>
</head>
<body>

<header>
  <h1>AU 2026 選課管理</h1>
  <div class="sub">9月15–17日 · The Venetian, Las Vegas · <b>★必上</b> / ○備選 · 資料存本機,會後永久保留 · <span id="catStat">課程庫載入中…</span></div>
</header>

<nav class="days" id="dayTabs"></nav>

<div class="toolbar">
  <input type="search" id="q" placeholder="搜尋我的課表:代碼、名稱、講者、地點…">
  <button class="chip" data-filter="star">★必上</button>
  <button class="chip" data-filter="lab">Lab</button>
  <button class="chip" data-filter="reg">已報名</button>
  <button class="chip" data-filter="note">有筆記</button>
</div>

<main id="list"></main>

<div class="datablock">
  <h4>資料保存與備份</h4>
  <p>課表與筆記自動存在此瀏覽器。放上 GitHub Pages 後,任何裝置開啟網址即可用;換裝置請先匯出 JSON 再匯入。</p>
  <div class="btns">
    <button class="btn small" onclick="exportJSON()">匯出我的課表 JSON</button>
    <button class="btn small" onclick="document.getElementById('scheduleCsv').click()">匯入 AU My Schedule CSV</button>
    <button class="btn small" onclick="document.getElementById('importFile').click()">匯入課表 JSON</button>
    <button class="btn small" onclick="exportCSV()">匯出 CSV(Excel)</button>
    <button class="btn small" onclick="window.print()">列印 / 存 PDF</button>
    <input type="file" id="scheduleCsv" accept=".csv,text/csv" style="display:none" onchange="importScheduleCSV(event)">
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>
</div>

<div class="bottombar">
  <button class="btn" onclick="openCatalog()">📚 課程庫</button>
  <button class="btn primary" onclick="openEditor()">＋ 新增</button>
</div>

<!-- 編輯課程 -->
<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlgTitle">新增課程</h2><button class="btn small" onclick="dlg.close()">關閉</button></div>
  <form class="dlg-body" id="form" method="dialog" onsubmit="saveSession(event)">
    <div class="grid2">
      <label class="f">課程代碼<input name="code" placeholder="例:AS2564"></label>
      <label class="f">類型
        <select name="type"><option>講座</option><option>Hands-On Lab</option><option>Keynote</option>
        <option>Technical Deep Dive</option><option>Strategy Talk</option><option>Meetup</option>
        <option>Expo / 攤位</option><option>社交 / 餐敘</option><option>餐飲</option><option>其他</option></select>
      </label>
    </div>
    <label class="f">課程名稱 *<input name="title" required></label>
    <div class="grid3">
      <label class="f">日期
        <select name="day"><option value="">未排定 / 待確認</option><option value="2026-09-14">9/14(一)</option>
        <option value="2026-09-15">9/15(二)</option><option value="2026-09-16">9/16(三)</option>
        <option value="2026-09-17">9/17(四)</option><option value="2026-09-18">9/18(五)</option></select>
      </label>
      <label class="f">開始<input name="start" type="time"></label>
      <label class="f">結束<input name="end" type="time"></label>
    </div>
    <div class="grid2">
      <label class="f">地點<input name="location"></label>
      <label class="f">講者<input name="speakers"></label>
    </div>
    <div class="grid3">
      <label class="f">優先級
        <select name="priority"><option value="star">★ 必上</option><option value="alt">○ 備選</option><option value="none">一般</option></select>
      </label>
      <label class="f">狀態
        <select name="status"><option>未定</option><option>已報名</option><option>候補中</option><option>已完成</option></select>
      </label>
      <label class="f">Digital Replay
        <select name="replay"><option value="no">無 / 未知</option><option value="yes">有錄影重播</option></select>
      </label>
    </div>
    <label class="f">課程頁連結<input name="url" placeholder="https://…(自動帶入)"></label>
    <label class="f">筆記(行前準備、現場心得、Replay 連結…)<textarea name="notes"></textarea></label>
    <input type="hidden" name="id">
    <div class="dlg-actions">
      <button type="button" class="btn danger" id="delBtn" onclick="deleteSession()">刪除</button>
      <div class="right"><button type="button" class="btn" onclick="dlg.close()">取消</button>
      <button type="submit" class="btn primary">儲存</button></div>
    </div>
  </form>
</dialog>

<!-- 課程庫 -->
<dialog id="catDlg">
  <div class="dlg-head"><h2>課程庫 <span class="hint" id="catCount"></span></h2>
    <button class="btn small" onclick="catDlg.close()">關閉</button></div>
  <div class="dlg-body">
    <label class="f">貼上妳的課單(可整段貼,自動辨識課程代碼)
      <textarea id="codePaste" placeholder="例:BLD1782, AS2564 AS1719&#10;CS3038-D…"></textarea>
    </label>
    <div class="grid2">
      <label class="f">加入為
        <select id="batchPriority"><option value="star">★ 必上</option><option value="alt">○ 備選</option></select>
      </label>
      <button class="btn primary" style="align-self:end" onclick="batchAdd()">批次比對並加入課表</button>
    </div>
    <label class="f">搜尋課程庫<input type="search" id="catQ" placeholder="代碼、關鍵字、講者…" oninput="renderCat()"></label>
    <div id="catList"></div>
    <div class="btns" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" onclick="document.getElementById('catFile').click()">匯入課程庫 JSON(抓取工具產出)</button>
      <input type="file" id="catFile" accept=".json" style="display:none" onchange="importCatalog(event)">
    </div>
    <p class="hint">課程庫已包含 AU 官方現場 592 堂與數位 173 堂，共 765 堂；中文名稱優先顯示，並保留英文原名供現場核對。</p>
  </div>
</dialog>

<script>
const KEY='au2026-sessions-v1', CATKEY='au2026-catalog-v1';
const DAYS=[
  {v:'all',label:'全部'},
  {v:'2026-09-15',label:'9/15 二',theme:'AI 策略 × Keynote'},
  {v:'2026-09-16',label:'9/16 三',theme:'技術自動化 × MCP 實作'},
  {v:'2026-09-17',label:'9/17 四',theme:'大地/營建應用 × 變革領導'},
  {v:'other',label:'其他日'},
  {v:'',label:'未排定'}
];
const MAIN_DAYS=['2026-09-15','2026-09-16','2026-09-17'];

const SEED=[
 {id:'s1',code:'BLD1782',title:'Revit Public MCP Server Lab',type:'Hands-On Lab',day:'',start:'',end:'',location:'',speakers:'',priority:'star',status:'候補中',replay:'no',url:'',
  notes:'三源一致必上。名額已滿——立即登入 AU 帳號加入候補!時間請用課程庫比對或在 My Schedule 核對。'},
 {id:'s2',code:'AS2564',title:'MCP + Dynamo + pyRevit Automation',type:'講座',day:'',start:'',end:'',location:'',speakers:'',priority:'star',status:'未定',replay:'no',url:'',
  notes:'三源一致必上。時間待從課程庫帶入。'},
 {id:'s3',code:'AS1719',title:'AI Adoption Plan Lab',type:'Hands-On Lab',day:'',start:'',end:'',location:'',speakers:'',priority:'star',status:'未定',replay:'no',url:'',
  notes:'三源一致必上。Hands-On Lab 需確認預先報名。'},
 {id:'s4',code:'',title:'Hell’s Kitchen 晚餐(Caesars Palace)',type:'社交 / 餐敘',day:'2026-09-15',start:'19:00',end:'21:00',location:'Caesars Palace',speakers:'',priority:'star',status:'已報名',replay:'no',url:'',
  notes:'OpenTable 已訂。推薦:HK Signature Prix Fixe、Beef Wellington、Sticky Toffee Pudding。'}
];

let data=load(), CATALOG=[], curDay='all', curFilters=new Set(), q='';
const dlg=document.getElementById('dlg'), catDlg=document.getElementById('catDlg');

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return SEED.map(s=>({...s}));}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){alert('儲存失敗:請立即匯出 JSON 備份。');}}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(x){return (x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function badge(cls,txt){return '<span class="badge '+cls+'">'+txt+'</span>';}

/* ---------- 課程庫載入 ---------- */
function setCatStat(){
  document.getElementById('catStat').textContent='課程庫 '+CATALOG.length+' 場';
  const c=document.getElementById('catCount');if(c)c.textContent='('+CATALOG.length+' 場)';
}
function normCat(arr){
  return (arr||[]).filter(s=>s&&s.title).map(s=>({code:(s.code||'').toUpperCase(),title:s.title,titleEn:s.titleEn||'',day:s.day||'',
    start:s.start||'',end:s.end||'',location:s.location||'',type:s.type||'講座',speakers:s.speakers||'',
    url:s.url||'',delivery:s.delivery||'inperson',enroll:!!s.enroll,replay:!!s.replay}));
}
function mergeCat(arr){
  const key=s=>(s.code||s.title)+'|'+s.day+'|'+s.start;
  const map={};CATALOG.forEach(s=>map[key(s)]=s);normCat(arr).forEach(s=>map[key(s)]=s);
  CATALOG=Object.values(map);
  try{localStorage.setItem(CATKEY,JSON.stringify(CATALOG));}catch(e){}
  setCatStat();
}
(function initCatalog(){
  try{const c=localStorage.getItem(CATKEY);if(c)CATALOG=JSON.parse(c);}catch(e){}
  setCatStat();
  fetch('catalog.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(j&&j.sessions){
      CATALOG=normCat(j.sessions);
      try{localStorage.setItem(CATKEY,JSON.stringify(CATALOG));}catch(e){}
      setCatStat();
    }
  }).catch(()=>{ /* 無網路時沿用上次成功下載的課程庫 */ });
})();
function importCatalog(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);mergeCat(Array.isArray(j)?j:j.sessions);
    alert('課程庫已更新,共 '+CATALOG.length+' 場。');renderCat();}catch(e){alert('格式錯誤。');}};
  r.readAsText(f);ev.target.value='';
}

/* ---------- 課程庫 UI ---------- */
function openCatalog(){renderCat();catDlg.showModal();}
function renderCat(){
  const kw=(document.getElementById('catQ').value||'').trim().toLowerCase();
  const el=document.getElementById('catList');
  let items=CATALOG;
  if(kw)items=items.filter(s=>(s.code+' '+s.title+' '+(s.titleEn||'')+' '+s.speakers+' '+s.location+' '+s.type).toLowerCase().includes(kw));
  items=items.slice(0,60);
  el.innerHTML=items.map((s,i)=>{
    const idx=CATALOG.indexOf(s);
    const dayTxt=s.day?s.day.slice(5).replace('-','/')+(s.start?' '+s.start+'–'+s.end:''):'時間待確認';
    return '<div class="cat-item"><div class="info">'
      +(s.code?'<span class="c">'+esc(s.code)+'</span> ':'')
      +(s.delivery==='digital'?badge('b-dig','數位'):'')
      +(s.enroll?badge('b-wait','需報名'):'')
      +'<div class="t">'+esc(s.title)+'</div>'
      +(s.titleEn?'<div class="title-en">'+esc(s.titleEn)+'</div>':'')
      +'<div class="m">'+dayTxt+'　'+esc(s.location||'')+(s.speakers?'　'+esc(s.speakers):'')+'</div></div>'
      +'<button class="btn small" onclick="addFromCat('+idx+')">＋加入</button></div>';
  }).join('')||'<p class="hint">找不到。若課程庫還不完整,請先用抓取工具匯入完整清單。</p>';
}
function catToSession(s,priority){
  return {id:uid(),code:s.code,title:s.title,titleEn:s.titleEn||'',day:s.day,start:s.start,end:s.end,location:s.location,
    type:s.type,speakers:s.speakers,priority:priority||'alt',status:s.enroll?'未定':'未定',
    replay:(s.replay||s.delivery==='digital')?'yes':'no',url:s.url,notes:''};
}
function addFromCat(i){
  const s=CATALOG[i];if(!s)return;
  if(data.some(d=>d.code&&s.code&&d.code===s.code&&d.day===s.day)){alert(s.code+' 已在課表中。');return;}
  data.push(catToSession(s,'alt'));persist();render();
  alert('已加入:'+(s.code||s.title));
}
function batchAdd(){
  const txt=document.getElementById('codePaste').value;
  const pr=document.getElementById('batchPriority').value;
  const codes=[...new Set((txt.toUpperCase().match(/[A-Z]{2,5}\d{3,5}(?:-D)?/g)||[]))];
  if(!codes.length){alert('沒有辨識到課程代碼。');return;}
  const added=[],missed=[],dup=[];
  codes.forEach(c=>{
    if(data.some(d=>(d.code||'').toUpperCase()===c)){dup.push(c);return;}
    const hit=CATALOG.filter(s=>s.code===c);
    if(hit.length){hit.forEach(h=>data.push(catToSession(h,pr)));added.push(c);}
    else{data.push({id:uid(),code:c,title:c+'(課程庫查無,請補時間)',type:'講座',day:'',start:'',end:'',
      location:'',speakers:'',priority:pr,status:'未定',replay:'no',url:'',notes:'課程庫中找不到此代碼——請先用抓取工具更新課程庫,或手動填時間。'});
      missed.push(c);}
  });
  persist();render();
  alert('比對完成\n✅ 找到並加入:'+(added.join(', ')||'無')
    +'\n⚠️ 庫中查無(已建占位):'+(missed.join(', ')||'無')
    +'\n↩️ 已在課表跳過:'+(dup.join(', ')||'無'));
  catDlg.close();
}

/* ---------- 我的課表 ---------- */
function renderTabs(){
  const el=document.getElementById('dayTabs');el.innerHTML='';
  DAYS.forEach(d=>{
    let n;
    if(d.v==='all')n=data.length;
    else if(d.v==='other')n=data.filter(s=>s.day&&!MAIN_DAYS.includes(s.day)).length;
    else n=data.filter(s=>s.day===d.v).length;
    const b=document.createElement('button');
    b.innerHTML=d.label+'<span class="n">'+n+'</span>';
    if(d.v===curDay)b.classList.add('on');
    b.onclick=()=>{curDay=d.v;render();};
    el.appendChild(b);
  });
}
function inDay(s,v){
  if(v==='all')return true;
  if(v==='other')return s.day&&!MAIN_DAYS.includes(s.day);
  return s.day===v;
}
function match(s){
  if(!inDay(s,curDay))return false;
  if(curFilters.has('star')&&s.priority!=='star')return false;
  if(curFilters.has('lab')&&s.type!=='Hands-On Lab')return false;
  if(curFilters.has('reg')&&s.status!=='已報名')return false;
  if(curFilters.has('note')&&!(s.notes||'').trim())return false;
  if(q){const t=(s.code+' '+s.title+' '+(s.speakers||'')+' '+(s.location||'')+' '+(s.notes||'')).toLowerCase();
    if(!t.includes(q))return false;}
  return true;
}
function overlap(a,b){return a.day&&a.day===b.day&&a.start&&a.end&&b.start&&b.end&&a.start<b.end&&b.start<a.end;}
function conflictsOf(s){
  return data.filter(o=>o.id!==s.id&&overlap(s,o)&&o.status!=='已完成'&&s.status!=='已完成'
    &&(s.priority!=='none'||o.priority!=='none'||s.status==='已報名'||o.status==='已報名'));
}
function cardHTML(s){
  const b=[];
  if(s.priority==='star')b.push(badge('b-star','★必上'));
  if(s.priority==='alt')b.push(badge('b-alt','○備選'));
  if(s.type==='Hands-On Lab')b.push(badge('b-lab','Lab'));
  if(s.status==='已報名')b.push(badge('b-reg','已報名'));
  if(s.status==='候補中')b.push(badge('b-wait','候補中'));
  if(s.status==='已完成')b.push(badge('b-done','✓已完成'));
  if(s.replay==='yes')b.push(badge('b-replay','有Replay'));
  const meta=[s.type,s.location,s.speakers].filter(Boolean).map(esc).join('　');
  const conf=conflictsOf(s);
  let h='<div class="slot">';
  h+='<div class="time'+(s.start?'':' tbd')+'">'+(s.start?esc(s.start)+'<span class="end">'+esc(s.end||'')+'</span>':'時間<br>待確認')+'</div>';
  h+='<div class="card p-'+s.priority+(s.status==='已完成'?' done':'')+'" onclick="openEditor(\''+s.id+'\')">';
  h+='<div class="row1">'+(s.code?'<span class="code">'+esc(s.code)+'</span>':'')+b.join(' ')+'</div>';
  h+='<h3>'+esc(s.title)+'</h3>';
  if(s.titleEn)h+='<div class="title-en">'+esc(s.titleEn)+'</div>';
  if(meta)h+='<div class="meta">'+meta+'</div>';
  if((s.notes||'').trim())h+='<div class="note-preview">📝 '+esc(s.notes)+'</div>';
  h+='</div></div>';
  if(conf.length)h+='<div class="conflict">⚠ 時間衝突:'+conf.map(c=>esc(c.code||c.title)).join('、')
    +'。原則:實體限定優先於有 Replay 的場次。</div>';
  return h;
}
function render(){
  renderTabs();
  const list=document.getElementById('list');
  const shown=data.filter(match);
  if(!shown.length){list.innerHTML='<div class="empty">沒有符合的課程。<br>從「📚 課程庫」加入,或「＋新增」。</div>';return;}
  const groups=curDay==='all'?DAYS.slice(1):DAYS.filter(d=>d.v===curDay);
  let h='';
  groups.forEach(d=>{
    const items=shown.filter(s=>inDay(s,d.v)).sort((a,b)=>((a.day||'9999')+(a.start||'99'))<((b.day||'9999')+(b.start||'99'))?-1:1);
    if(!items.length)return;
    h+='<div class="daytitle"><b>'+d.label+'</b>'+(d.theme?'<span>'+d.theme+'</span>':'')
      +(d.v===''?'<span>用課程庫比對即可自動帶入時間</span>':'')+'</div>';
    items.forEach(s=>h+=cardHTML(s));
  });
  list.innerHTML=h||'<div class="empty">沒有符合的課程。</div>';
}

/* ---------- 編輯 ---------- */
function openEditor(id){
  const f=document.getElementById('form');f.reset();
  const s=id?data.find(x=>x.id===id):null;
  document.getElementById('dlgTitle').textContent=s?'編輯課程':'新增課程';
  document.getElementById('delBtn').style.visibility=s?'visible':'hidden';
  if(s)for(const k of ['code','title','type','day','start','end','location','speakers','priority','status','replay','url','notes','id'])
    if(f[k]!==undefined)f[k].value=s[k]||'';
  if(!s)f.id.value='';
  dlg.showModal();
}
function saveSession(e){
  const f=document.getElementById('form');const obj={};
  ['code','title','type','day','start','end','location','speakers','priority','status','replay','url','notes']
    .forEach(k=>obj[k]=(f[k].value||'').trim?f[k].value.trim():f[k].value);
  const id=f.id.value;
  if(id){const i=data.findIndex(x=>x.id===id);data[i]={...data[i],...obj};}
  else{obj.id=uid();data.push(obj);}
  persist();render();
}
function deleteSession(){
  const id=document.getElementById('form').id.value;
  if(id&&confirm('確定刪除這筆課程?')){data=data.filter(x=>x.id!==id);persist();dlg.close();render();}
}

/* ---------- 匯出 / 匯入 ---------- */
function dl(name,content,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportJSON(){
  dl('AU2026我的課表_'+new Date().toISOString().slice(0,10)+'.json',
    JSON.stringify({exported:new Date().toISOString(),sessions:data},null,2),'application/json');
}

function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
    if(c==='"'&&quoted&&n==='"'){cell+='"';i++;}
    else if(c==='"')quoted=!quoted;
    else if(c===','&&!quoted){row.push(cell);cell='';}
    else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell='';}
    else cell+=c;
  }
  row.push(cell);if(row.some(x=>x!==''))rows.push(row);
  const head=rows.shift().map(x=>x.trim());
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
}
function importScheduleCSV(ev){
  const file=ev.target.files[0];if(!file)return;const reader=new FileReader();
  reader.onload=()=>{try{
    const rows=parseCSV(reader.result.replace(/^\uFEFF/,''));
    if(!rows.length||!rows[0]['Session Code'])throw new Error('找不到 Session Code 欄位');
    const imported=rows.map((r,i)=>{
      const code=(r['Session Code']||'').toUpperCase();
      const p=(r.Date||'').split('/');const day=p.length===3?p[0]+'-'+p[1].padStart(2,'0')+'-'+p[2].padStart(2,'0'):'';
      const start=r['Start Time']||'';
      const hit=CATALOG.find(s=>s.code===code&&s.day===day&&s.start===start)
        ||CATALOG.find(s=>s.code===code&&s.day===day)||CATALOG.find(s=>s.code===code);
      const raw=(r['Session Title']||code).replace(/^\(Favorited\)\s*/,'');
      const manual={4523:'Forma Futures 啟動工作坊',4317:'亞太區歡迎交流餐會'};
      return {id:'csv'+Date.now().toString(36)+i,code,title:hit?hit.title:(manual[code]||raw),titleEn:hit?(hit.titleEn||raw):raw,
        day,start,end:r['End Time']||'',location:r.Room||(hit?hit.location:''),type:hit?hit.type:'課程',
        speakers:hit?hit.speakers:'',priority:r.Status==='Scheduled'?'star':'alt',
        status:r.Status==='Scheduled'?'已報名':'未定',replay:hit&&hit.replay?'yes':'no',
        url:hit?hit.url:'',notes:'AU My Schedule：'+(r.Status||'')};
    });
    if(confirm('已讀取 '+imported.length+' 筆。按「確定」覆蓋目前課表；按「取消」則合併。'))data=imported;
    else{const keys=new Set(data.map(s=>s.code+'|'+s.day+'|'+s.start));imported.forEach(s=>{const k=s.code+'|'+s.day+'|'+s.start;if(!keys.has(k)){data.push(s);keys.add(k);}});}
    persist();render();alert('My Schedule 匯入完成，共 '+imported.length+' 筆。');
  }catch(e){alert('CSV 匯入失敗：'+e.message);}
  ev.target.value='';
  };reader.readAsText(file);
}

function importJSON(ev){
  const file=ev.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);const arr=Array.isArray(j)?j:j.sessions;
    if(!Array.isArray(arr))throw 0;
    if(confirm('匯入 '+arr.length+' 筆。「確定」=覆蓋,「取消」=合併。'))data=arr;
    else{const ids=new Set(data.map(s=>s.id));arr.forEach(s=>{if(!ids.has(s.id))data.push(s);});}
    persist();render();alert('匯入完成。');
  }catch(e){alert('檔案格式錯誤。');}};
  r.readAsText(file);ev.target.value='';
}
function exportCSV(){
  const head=['日期','開始','結束','代碼','名稱','類型','優先級','狀態','地點','講者','Replay','連結','筆記'];
  const pr={star:'★必上',alt:'○備選',none:'一般'};
  const rows=data.slice().sort((a,b)=>((a.day||'9999')+(a.start||''))<((b.day||'9999')+(b.start||''))?-1:1).map(s=>
    [s.day,s.start,s.end,s.code,s.title,s.type,pr[s.priority]||'',s.status,s.location,s.speakers,
     s.replay==='yes'?'有':'',s.url,(s.notes||'').replace(/\n/g,' ')]
    .map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','));
  dl('AU2026我的課表.csv','\uFEFF'+head.join(',')+'\n'+rows.join('\n'),'text/csv;charset=utf-8');
}

/* ---------- 事件 ---------- */
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});
document.querySelectorAll('.toolbar .chip').forEach(c=>c.onclick=()=>{
  const k=c.dataset.filter;curFilters.has(k)?curFilters.delete(k):curFilters.add(k);
  c.classList.toggle('on');render();});
persist();render();
